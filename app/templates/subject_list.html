{% extends "base.html" %}
{% block title %}Предметы{% endblock %}
{% block content %}
<h1>Предметы</h1>
<div class="card-grid">
  {% for c in cards %}
  <a class="subject-card" href="/subjects/{{ c.subject.slug }}">
    <h2>{{ c.subject.name }}</h2>
    <div class="progress-bar"><div class="progress-fill" style="width: {{ c.percent }}%"></div></div>
    <span class="percent-label">{{ c.percent }}% пройдено</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
