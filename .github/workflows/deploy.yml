name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to edu.rvnza.ru
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            echo "=== Edu Portal Deployment ==="
            cd "$DEPLOY_PATH" || exit 1
            echo "Fetching latest code..."
            git fetch origin --prune --force
            git reset --hard origin/main
            git clean -fdx -e .venv
            echo "Current: $(git log -1 --oneline)"
            echo "Python environment..."
            [ ! -d ".venv" ] && python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            python -c "from app.main import app; print('DB OK')"
            TOPIC_COUNT=$(python -c "from app.db import SessionLocal; from app.models import Topic; db=SessionLocal(); print(db.query(Topic).count()); db.close()")
            [ "$TOPIC_COUNT" -lt 500 ] && python pipeline/load_content.py || echo "Content OK ($TOPIC_COUNT topics)"
            # Deploy runs as root over SSH; the service runs as www-data, so hand
            # the whole tree back to it (this is what caused the portal.db
            # "unable to open database file" crash loop -- root-owned files the
            # service user couldn't read).
            chown -R www-data:www-data "$DEPLOY_PATH"
            echo "Restarting service..."
            systemctl restart edu-portal
            echo "=== Deployment Complete ==="
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      
      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed! Check the logs above for details."
