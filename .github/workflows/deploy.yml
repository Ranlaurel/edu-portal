name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to edu.rvnza.ru
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server via SSH v2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "DEBUG: Testing new script version v1"
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH }}"
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            
            echo "Listing files in DEPLOY_PATH:"
            ls -la "$DEPLOY_PATH" | head -20
            
            echo "Checking git status:"
            cd "$DEPLOY_PATH" && git status --short && git log --oneline -1
